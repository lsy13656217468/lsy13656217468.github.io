<!DOCTYPE html>
<!-- 自定义文字提示页面，零基础可直接修改文字部分 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机扫码，页面自动适应屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码提示</title>
    <style>
        /* 页面样式：居中显示、浅背景、文字放大，适合手机查看 */
        body {
            margin: 0;
            padding: 50px 20px;
            background-color: #f5f5f5;
            font-family: "微软雅黑", sans-serif;
            text-align: center;
        }
        /* 标题样式（可选） */
        .title {
            color: #e63946;
            font-size: 30px;
            margin-bottom: 30px;
        }
        /* 核心提示文字样式 */
        .content {
            color: #333;
            font-size: 24px;
            line-height: 2; /* 行间距，更易读 */
        }
    </style>
</head>
<body>
    <!-- 标题：恭喜上当！ -->
    <div class="title">🎉 扫码成功！</div>
    <!-- 此为个人产出无料，感谢支持！<br/>是换行符 -->
    <div class="content">
	此为个人无料，感谢支持！<br/>
        祝各位<br/>
        新年快乐！<br/>
	（让我们一起助力更多人受骗嘿嘿）<br/>
        
    </div>
</body>
</html>
